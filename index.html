<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyStatsPro</title>
<meta name="theme-color" content="#0B0D12">
<link rel="icon" href="Assets/teams/pretty-good-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0D12; --card: #171A21; --line: #2A2F3A; --text: #F4F6FA; --sub: #A3ABBA;
    --blue: #2456E5; --blue-hi: #5B9BFF;
    --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--body); }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 22px; }
  .logos { display: flex; gap: 10px; }
  .logos img { width: 64px; height: 64px; object-fit: contain; border-radius: 16px; background: #fff; padding: 6px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 52px; line-height: .95; text-transform: uppercase; }
  p { margin: 0; color: var(--sub); line-height: 1.5; }
  .choice { display: flex; flex-direction: column; gap: 4px; padding: 18px 20px; border-radius: 18px; text-decoration: none; color: var(--text); border: 1px solid var(--line); background: var(--card); }
  .choice b { font-size: 18px; }
  .choice span { font-size: 14px; color: var(--sub); }
  .choice.primary { background: var(--blue); border-color: var(--blue); }
  .choice.primary span { color: rgba(255,255,255,.85); }
  .choice:hover { border-color: var(--blue-hi); }
  .choice:focus-visible { outline: 3px solid var(--blue-hi); outline-offset: 3px; }
  .tag { align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,.2); margin-bottom: 4px; }
</style>
</head>
<body>
<main>
  <div class="logos" aria-hidden="true">
    <img src="Assets/teams/pretty-good-logo.png" alt="">
    <img src="Assets/teams/chuckers-chuckers-logo.png" alt="">
    <img src="Assets/teams/all-stars-logo.png" alt="">
  </div>
  <div>
    <h1>MyStatsPro</h1>
    <p>Stats for Pretty Good, Chuckers Chuckers and All Stars have moved to a new site.</p>
  </div>
  <a class="choice primary" href="https://denzo83.github.io/msp.v5/">
    <span class="tag">NEW</span>
    <b>Go to MyStatsPro v5</b>
    <span>All three teams in one place, with player pages, leaders, records and box scores.</span>
  </a>
  <a class="choice" href="teams.html">
    <b>Continue to the old site (v4)</b>
    <span>Pick a team on the original stats pages.</span>
  </a>
</main>
</body>
</html>
